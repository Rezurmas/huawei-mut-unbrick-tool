name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes ruff

      - name: Syntax check
        run: python -m py_compile unbrick_tool.py

      - name: Pyflakes
        run: python -m pyflakes unbrick_tool.py

      - name: Ruff (allow style warnings)
        run: python -m ruff check unbrick_tool.py --select F --output-format=concise
        continue-on-error: true

      - name: Custom audit
        run: python _test_audit.py

      - name: CLI list-adapters
        run: python unbrick_tool.py --cli --list-adapters

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check unbrick_tool.py --select F,E9 --output-format=concise
